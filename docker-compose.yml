services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: calc_bot:latest
    container_name: unitibot_bot
    restart: unless-stopped
    working_dir: /app/unitibot
    volumes:
      - ./data/BOT_TOKEN.py:/app/unitibot/data/BOT_TOKEN.py:ro
    command: ["bash", "/usr/local/bin/unitibot-start.sh"]

  web:
    image: calc_bot:latest
    container_name: unitibot_web
    restart: unless-stopped
    working_dir: /app/unitibot
    command:
      - python
      - -m
      - streamlit
      - run
      - web.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"